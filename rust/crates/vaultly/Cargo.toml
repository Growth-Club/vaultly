[package]
name = "vaultly"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vaultly encrypted credential manager with Cloudflare integration"

# cargo-binstall metadata: locates prebuilt binaries in GitHub Releases.
# Artifact layout matches .github/workflows/release.yml
# (vaultly-<target>-v<version>.tar.gz).
[package.metadata.binstall]
pkg-url = "https://github.com/Growth-Club/vaultly/releases/download/v{ version }/vaultly-{ target }-v{ version }.tar.gz"
bin-dir = "vaultly-{ target }-v{ version }/{ bin }{ binary-ext }"

[dependencies]
vaultly-core = { path = "../vaultly-core" }
vaultly-mcp = { path = "../vaultly-mcp" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
clap.workspace = true
clap_complete.workspace = true
dirs.workspace = true
chrono.workspace = true
colored.workspace = true
rpassword.workspace = true

[dev-dependencies]
tempfile = "3"
