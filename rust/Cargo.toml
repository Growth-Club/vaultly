[workspace]
resolver = "2"
members = ["crates/vaultly-core", "crates/vaultly", "crates/vaultly-mcp"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
regex = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "io-util", "io-std", "macros", "sync", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
dirs = "5"
shell-words = "1"
clap = { version = "4", features = ["derive"] }
serde_yaml = "0.9"
colored = "2"
rpassword = "7"
zeroize = "1"
blake3 = "1"

[profile.release]
lto = true
strip = true
