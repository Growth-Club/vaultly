name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo test --workspace
      - name: Repeat target maintenance path regressions 100 times
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            cargo test --locked -q -p vaultly-core target_script_workdir
          done
      - run: cargo clippy --workspace --all-targets -- -D warnings
