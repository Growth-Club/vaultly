name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            # macOS 13 runner provides the x86_64 (Intel) artifact.
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: cargo test --workspace

      - run: cargo build --release --package vaultly --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="vaultly-${{ matrix.target }}-v${VERSION}"
          BIN="target/${{ matrix.target }}/release/vaultly"
          mkdir -p "dist/${NAME}"
          cp "${BIN}" "dist/${NAME}/vaultly"
          chmod +x "dist/${NAME}/vaultly"
          (cd dist && tar -czf "${NAME}.tar.gz" "${NAME}")
          echo "artifact_path=$(realpath "dist/${NAME}.tar.gz")" >>"$GITHUB_ENV"
          echo "artifact_name=${NAME}.tar.gz" >>"$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ github.workspace }}/rust/dist/*.tar.gz
          generate_release_notes: true
